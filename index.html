

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>万华北京伴热台账可视化看板</title>
<style>
:root{--primary:#1a73e8;--secondary:#34a853;--danger:#ea4335;--warning:#fbbc05;--bg:#f4f7f6;--text:#202124;--muted:#5f6368;--border:#dadce0}
*{box-sizing:border-box}
body{font-family:'Segoe UI','Microsoft YaHei',sans-serif;margin:0;background:var(--bg);color:var(--text)}
.header{background:linear-gradient(135deg,#1a73e8,#0d47a1);color:#fff;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.1);display:flex;justify-content:space-between;align-items:center}
.header h1{margin:0;font-size:24px}.header p{margin:5px 0 0;font-size:14px;opacity:.8}
.header-actions{display:flex;gap:10px}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:14px;transition:background .2s}
.btn-export{background:#fff;color:var(--primary);font-weight:bold}
.btn-export:hover{background:#e8f0fe}
.btn-clear{background:rgba(255,255,255,0.2);color:#fff;border:1px solid rgba(255,255,255,0.4)}
.btn-clear:hover{background:rgba(255,255,255,0.3)}
.toolbar{background:#fff;padding:15px 20px;display:flex;gap:15px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.toolbar input{flex:1;padding:10px 15px;border:1px solid var(--border);border-radius:6px;outline:none;font-size:14px}
.toolbar input:focus{border-color:var(--primary)}
.toolbar select{padding:10px 15px;border:1px solid var(--border);border-radius:6px;font-size:14px}
.stats{padding:10px 20px;font-size:13px;color:var(--muted);background:#f8f9fa;display:flex;justify-content:space-between}
.container{padding:20px;max-width:1600px;margin:0 auto}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-bottom:30px}
.card{background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.05);border:1px solid var(--border);padding:15px;cursor:pointer;transition:transform .2s}
.card:hover{transform:translateY(-4px);border-color:var(--primary);box-shadow:0 8px 16px rgba(0,0,0,.1)}
.card h3{margin:0 0 10px;font-size:18px;color:var(--primary)}
.card-tag{float:right;font-size:12px;background:var(--secondary);color:#fff;padding:2px 6px;border-radius:4px}
.info-row{display:flex;justify-content:space-between;margin-bottom:8px;font-size:14px;border-bottom:1px dashed #eee;padding-bottom:8px}
.info-row:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.table-container{background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.05);border:1px solid var(--border);overflow:hidden}
.table-header{padding:15px 20px;background:#f8f9fa;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.table-wrapper{overflow-x:auto;max-height:600px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:1200px}
th{background:#e8f0fe;padding:12px 10px;text-align:left;position:sticky;top:0;z-index:10;border-bottom:2px solid var(--border)}
td{padding:10px;border-bottom:1px solid #eee}
tr:hover{background:#f8f9fa}
.status-active{color:var(--secondary);font-weight:bold}
.status-reserved{color:var(--danger);font-weight:bold}
.clickable{color:var(--primary);text-decoration:underline;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
.modal-content{background:#fff;width:90%;max-width:600px;border-radius:10px;overflow:hidden}
.modal-header{background:var(--primary);color:#fff;padding:15px;display:flex;justify-content:space-between}
.modal-header h2{margin:0;font-size:18px}
.close{background:none;border:none;color:#fff;font-size:24px;cursor:pointer}
.modal-body{padding:20px;max-height:70vh;overflow-y:auto;line-height:1.6}
#detailModal .modal-body img{cursor:zoom-in;transition:filter .15s}
#detailModal .modal-body img:hover{filter:brightness(.96)}
#lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:2000;align-items:center;justify-content:center;cursor:zoom-out}
#lightbox img{max-width:96%;max-height:92%;border-radius:8px;background:#fff;box-shadow:0 8px 40px rgba(0,0,0,.6);cursor:zoom-out}
#lightbox .lb-close{position:absolute;top:16px;right:26px;color:#fff;font-size:36px;line-height:1;cursor:pointer;font-weight:300}
#lightbox .lb-tip{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#fff;font-size:13px;opacity:.8}
#loadingMask{position:fixed;inset:0;background:#fff;z-index:2000;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--primary)}
.load-more{display:block;width:100%;padding:12px;margin-top:10px;background:#f8f9fa;border:1px dashed var(--border);border-radius:8px;color:var(--primary);cursor:pointer;font-size:14px}
.load-more:hover{background:#e8f0fe}
</style>
</head>
<body>

<div id="loadingMask">⏳ 正在解析数据，请稍候...</div>

<div class="header">
  <div>
    <h1>万华北京伴热分配盘全览看板</h1>
    <p>数据源：sheetTables 原始台账 · A02版</p>
  </div>
  <div class="header-actions">
    <button class="btn btn-export" onclick="exportData()">📥 导出当前数据(CSV)</button>
    <button class="btn btn-clear" onclick="clearCache()">🔄 清除缓存</button>
  </div>
</div>

<div class="toolbar">
  <input type="text" id="searchInput" placeholder="搜索分配盘编号、位置、介质、对侧盘编号...">
  <select id="areaFilter"><option value="">全部区域</option></select>
</div>

<div class="stats" id="statsDisplay">
  <span id="statsText">正在加载...</span>
  <span id="cacheBadge" style="display:none;color:var(--primary)">⚡ 本地缓存已启用</span>
</div>

<div class="container">
  <div class="card-grid" id="cardGrid"></div>
  <div id="cardsLoadMoreWrap"></div>
  
  <div class="table-container">
    <div class="table-header">
      <h2>📊 记录明细列表</h2>
      <span>共 <span id="tableCount">0</span> 条记录</span>
    </div>
    <div class="table-wrapper">
      <table>
        <thead><tr><th>记录ID</th><th>区域</th><th>分配盘</th><th>位置</th><th>阀位</th><th>介质</th><th>对侧系统</th><th>对侧盘</th><th>对侧阀位</th><th>状态</th></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <button class="load-more" id="tableLoadMore" style="display:none">加载更多记录…</button>
  </div>
</div>

<div id="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img" src="" alt="盘面表格图"/>
  <span class="lb-close" onclick="closeLightbox()">&times;</span>
  <div class="lb-tip">点击任意处或右上角 × 关闭 · 按 ESC 也可关闭</div>
</div>
<div class="modal" id="detailModal">
  <div class="modal-content">
    <div class="modal-header"><h2 id="modalTitle"></h2><button class="close" onclick="document.getElementById('detailModal').style.display='none'">&times;</button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="plate_data.js"></script>

function mapField(t) {
    if (t.indexOf('对侧系统') >= 0) return 'oppSys';
    if (t.indexOf('对侧盘位') >= 0) return 'oppPlate';
    if (t.indexOf('对侧阀位') >= 0) return 'oppValve';
    if (t.indexOf('对侧介质') >= 0) return 'oppMedia';
    if (t.indexOf('本盘介质') >= 0 || (t.indexOf('介质') >= 0 && t.indexOf('对侧') < 0)) return 'media';
    if ((t.indexOf('阀位') >= 0 || t.indexOf('位号') >= 0) && t.indexOf('对侧') < 0) return 'valve';
    if (t.indexOf('盘组') >= 0 || t.indexOf('方向') >= 0 || t.indexOf('走向') >= 0) return 'group';
    if (t.indexOf('序号') >= 0) return 'seq';
    if (t.indexOf('管廊') >= 0) return 'loc';
    return 'other';
}

function initData() {
    allPlates = [];
    allRecords = [];
    var keys = Object.keys(sheetTables);
    var recId = 0;
    keys.forEach(function(key) {
        var html = sheetTables[key];
        var ths = [];
        var thm = html.match(/<thead>[\s\S]*?<tr>([\s\S]*?)<\/tr>/);
        if (thm) {
            var thlist = thm[1].match(/<th[^>]*>([\s\S]*?)<\/th>/g);
            if (thlist) ths = thlist.map(function(x){ return x.replace(/<[^>]+>/g,'').trim(); });
        }
        var rows = [];
        var trm = html.match(/<tbody>([\s\S]*?)<\/tbody>/);
        var bodyStr = trm ? trm[1] : '';
        var trlist = bodyStr.match(/<tr[^>]*>([\s\S]*?)<\/tr>/g);
        if (trlist) {
            trlist.forEach(function(tr){
                var tdlist = tr.match(/<td[^>]*>([\s\S]*?)<\/td>/g);
                if (tdlist) rows.push(tdlist.map(function(x){ return x.replace(/<[^>]+>/g,'').trim(); }));
            });
        }
        var fields = ths.map(function(t){ return mapField(t); });
        var locVal = '';
        var groupVal = '';
        var plate = {
            id: key,
            name: PLATE_NAME[key] || key,
            type: '',
            area: guessArea(key),
            loc: '',
            valves: rows.length,
            inuse: 0,
            reserved: 0
        };
        rows.forEach(function(cells){
            var r = { id: key + '-' + (recId + 1), area: plate.area, plate: key, loc:'', valve:'', media:'', oppSys:'', oppPlate:'', oppValve:'', status:'在用' };
            cells.forEach(function(cell, idx){
                var f = fields[idx];
                if (f === 'media') r.media = cell;
                else if (f === 'valve') r.valve = cell;
                else if (f === 'oppSys') r.oppSys = cell;
                else if (f === 'oppPlate') r.oppPlate = cell;
                else if (f === 'oppValve') r.oppValve = cell;
                else if (f === 'oppMedia') { if (!r.media) r.media = cell; }
                else if (f === 'group') { if (!groupVal && cell && cell !== '同上') groupVal = cell; }
                else if (f === 'loc') { if (!locVal) locVal = cell; }
                else if (f === 'seq') { if (!r.valve) r.valve = cell; }
            });
            r.loc = locVal || groupVal || plate.name;
            if (r.media.indexOf('预留') >= 0 || r.oppPlate.indexOf('预留') >= 0 || r.oppValve.indexOf('预留') >= 0) r.status = '预留';
            if (r.status === '预留') plate.reserved++; else plate.inuse++;
            r.id = key + '-' + (recId + 1);
            allRecords.push(r);
            recId++;
        });
        plate.loc = locVal || groupVal || plate.name;
        plate.type = (plate.name.indexOf('回水') >= 0) ? '回水' : ((plate.name.indexOf('进水') >= 0) ? '进水' : '分配盘');
        allPlates.push(plate);
    });
}

function kCleanName(s) {
    return (s || '').replace(/^H2W[SR]\s*[：:]\s*/, '').trim();
}
function kValidName(s) {
    var t = kCleanName(s);
    return t !== '';
}
function applyKOverride() {
    Object.keys(K_OVERRIDE).forEach(function(pid) {
        var p = null;
        for (var i = 0; i < allPlates.length; i++) { if (allPlates[i].id === pid) { p = allPlates[i]; break; } }
        if (!p) return;
        var rows = K_OVERRIDE[pid];
        var old = allRecords.filter(function(r){ return r.plate === pid; });
        allRecords = allRecords.filter(function(r){ return r.plate !== pid; });
        rows.forEach(function(row, idx) {
            var o = old[idx] || {};
            var valve = kValidName(row.v1) ? row.v1 : (o.valve || '—');
            var oppValve = kValidName(row.v2) ? row.v2 : (o.oppValve || '—');
            var media = row.media || o.media || '—';
            var status = (/预留/.test(media) || /预留/.test(valve) || /预留/.test(oppValve)) ? '预留' : '在用';
            allRecords.push({
                id: pid + '-' + (idx + 1), area: 'K管廊', plate: pid,
                loc: (o.loc || p.loc), valve: valve, media: media,
                oppSys: '', oppPlate: '', oppValve: oppValve, status: status
            });
        });
        p.valves = rows.length;
        p.inuse = allRecords.filter(function(r){ return r.plate === pid && r.status !== '预留'; }).length;
        p.reserved = p.valves - p.inuse;
    });
}

function initAreaFilter() {
    var set = {};
    allPlates.forEach(function(p) { set[p.area] = 1; });
    var select = document.getElementById('areaFilter');
    select.innerHTML = '<option value="">全部区域</option>';
    for (var area in set) {
        var o = document.createElement('option'); o.value = area; o.textContent = area;
        select.appendChild(o);
    }
}

function renderPlates() {
    var grid = document.getElementById('cardGrid');
    var end = Math.min(cardRendered + PAGE_SIZE_CARDS, filteredPlates.length);
    var frag = document.createDocumentFragment();
    for (var i = cardRendered; i < end; i++) {
        var p = filteredPlates[i];
        var card = document.createElement('div');
        card.className = 'card';
        card.onclick = (function(id){ return function(){ showModal(id); }; })(p.id);
        card.innerHTML = '<h3>' + (p.name || p.id) + '<span class="card-tag">' + p.type + '</span></h3>' +
                         '<div class="info-row"><span>区域</span><span>' + p.area + '</span></div>' +
                         '<div class="info-row"><span>位置</span><span>' + p.loc + '</span></div>' +
                         '<div class="info-row"><span>总阀位</span><span>' + p.valves + '</span></div>' +
                         '<div class="info-row"><span>在用/预留</span><span><span class="status-active">' + p.inuse + '</span> / <span class="status-reserved">' + p.reserved + '</span></span></div>';
        frag.appendChild(card);
    }
    grid.appendChild(frag);
    cardRendered = end;

    var wrap = document.getElementById('cardsLoadMoreWrap');
    wrap.innerHTML = '';
    if (cardRendered < filteredPlates.length) {
        var btn = document.createElement('button');
        btn.className = 'load-more';
        btn.textContent = '加载更多分配盘（' + cardRendered + ' / ' + filteredPlates.length + '）';
        btn.onclick = renderPlates;
        wrap.appendChild(btn);
    }
}

function renderTable() {
    var tbody = document.getElementById('tableBody');
    var end = Math.min(rowRendered + PAGE_SIZE_ROWS, filteredRecords.length);
    var frag = document.createDocumentFragment();
    for (var i = rowRendered; i < end; i++) {
        var r = filteredRecords[i];
        var tr = document.createElement('tr');
        tr.innerHTML = '<td>' + r.id + '</td><td>' + r.area + '</td><td>' + r.plate + '</td><td>' + r.loc + '</td><td>' + r.valve + '</td><td>' + r.media + '</td><td>' + r.oppSys + '</td><td>' + r.oppPlate + '</td><td>' + r.oppValve + '</td><td><span class="' + (r.status === '预留' ? 'status-reserved' : 'status-active') + '">' + r.status + '</span></td>';
        frag.appendChild(tr);
    }
    tbody.appendChild(frag);
    rowRendered = end;

    var btn = document.getElementById('tableLoadMore');
    if (rowRendered < filteredRecords.length) {
        btn.style.display = 'block';
        btn.textContent = '加载更多记录（' + rowRendered + ' / ' + filteredRecords.length + '）';
    } else {
        btn.style.display = 'none';
    }
}

function renderAll() {
    cardRendered = 0; rowRendered = 0;
    document.getElementById('cardGrid').innerHTML = '';
    document.getElementById('tableBody').innerHTML = '';
    renderPlates();
    renderTable();
    document.getElementById('tableCount').innerText = filteredRecords.length;
    document.getElementById('statsText').innerText = '当前展示 ' + filteredPlates.length + ' 个分配盘，' + filteredRecords.length + ' 条记录';
}

function applyFilters() {
    var text = document.getElementById('searchInput').value.toLowerCase();
    var area = document.getElementById('areaFilter').value;
    
    filteredPlates = allPlates.filter(function(p) {
        var matchText = !text || p.id.toLowerCase().indexOf(text) >= 0 || p.area.indexOf(text) >= 0 || p.loc.indexOf(text) >= 0;
        var matchArea = !area || p.area === area;
        return matchText && matchArea;
    });
    filteredRecords = allRecords.filter(function(r) {
        var matchText = !text || r.id.toLowerCase().indexOf(text) >= 0 || r.media.indexOf(text) >= 0 || r.oppPlate.indexOf(text) >= 0;
        var matchArea = !area || r.area === area;
        return matchText && matchArea;
    });
    
    renderAll();
}

function showModal(id) {
    var p = allPlates.find(function(x){ return x.id === id; });
    if (!p) return;
    document.getElementById('modalTitle').innerText = '分配盘：' + (p.name || id);
    var related = allRecords.filter(function(r){ return r.plate === id; });
    var img = PLATE_IMG[id] || PLATE_IMG_EXTRA[id] || '';
    
    var html = (img ? ('<div style="margin:0 0 14px;text-align:center;">'
    + '<div style="font-weight:bold;margin-bottom:6px;text-align:left;">盘面表格图</div>'
    + '<img src="' + img + '" title="点击图片可放大查看" onclick="openLightbox(this.src)" style="width:100%;max-width:540px;border:1px solid #d0d7de;border-radius:6px;background:#fff;"/>'
    + '</div>') : '') + '<div><strong>区域：</strong>' + p.area + '</div><div><strong>位置：</strong>' + p.loc + '</div><div><strong>阀位：</strong>共 ' + p.valves + ' 个</div><hr style="border:0;border-top:1px dashed #eee;margin:15px 0">';
    
    html += related.map(function(r) {
        return '<div style="background:#f8f9fa;padding:10px;border-radius:6px;margin-bottom:10px;border:1px solid #eee;font-size:13px;">' +
               '<div style="font-weight:bold;margin-bottom:4px;">阀位：' + r.valve + ' <span style="float:right;color:' + (r.status==='预留'?'var(--danger)':'var(--secondary)') + '">' + r.status + '</span></div>' +
               '<div>介质：' + r.media + '</div>' +
               '<div style="color:#666;margin-top:4px;">对侧：' + ((r.oppValve && (r.oppValve.indexOf('：') >= 0 || r.oppValve.indexOf(':') >= 0)) ? r.oppValve : ([r.oppSys, r.oppPlate, (r.oppValve === '—' ? '' : r.oppValve)].filter(function(x){ return x; }).join(' - ') || '—')) + '</div>' +
               '</div>';
    }).join('');
    
    document.getElementById('modalBody').innerHTML = html;
    document.getElementById('detailModal').style.display = 'flex';
}

function openLightbox(src){
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').style.display = 'flex';
}
function closeLightbox(){
  document.getElementById('lightbox').style.display = 'none';
}
document.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ closeLightbox(); } });

// 启动
try {
    initData();
    initAreaFilter();
    applyKOverride();   // K管廊：按K管廊.xlsx小板块对齐阀位名称
    applyFilters();   // 初始化 filteredPlates/filteredRecords 并渲染（全部区域+无搜索）
    document.getElementById('loadingMask').style.display = 'none';
    console.log('✅ 渲染成功');
} catch (e) {
    document.getElementById('loadingMask').innerText = '❌ 报错: ' + e.message;
    console.error(e);
}

// ==========================================
// 导出功能
// ==========================================
function exportData() {
    var text = document.getElementById('searchInput').value.toLowerCase();
    var area = document.getElementById('areaFilter').value;
    
    var dataToExport = allRecords.filter(function(r) {
        var matchText = !text || r.id.toLowerCase().indexOf(text) >= 0 || r.media.indexOf(text) >= 0 || r.oppPlate.indexOf(text) >= 0;
        var matchArea = !area || r.area === area;
        return matchText && matchArea;
    });

    if (dataToExport.length === 0) {
        alert('当前没有可导出的数据！');
        return;
    }

    var csvContent = "\uFEFF";
    csvContent += "记录ID,区域,分配盘,位置,阀位,本盘介质,对侧系统,对侧盘,对侧阀位,状态\n";
    
    dataToExport.forEach(function(r) {
        var row = [r.id, r.area, r.plate, r.loc, r.valve, r.media, r.oppSys, r.oppPlate, r.oppValve, r.status];
        var cleanRow = row.map(function(cell) {
            return '"' + String(cell || '').replace(/"/g, '""') + '"';
        });
        csvContent += cleanRow.join(',') + "\n";
    });

    var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    link.setAttribute("href", url);
    link.setAttribute("download", "伴热台账导出_" + new Date().getTime() + ".csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

// ==========================================
// 清除缓存/重置
// ==========================================
function clearCache() {
    if (confirm("确定要清除所有临时数据并重置页面吗？\n（这不会删除你的代码，只是把数据恢复到初始状态）")) {
        location.reload();
    }
}

document.getElementById('searchInput').addEventListener('input', applyFilters);
document.getElementById('areaFilter').addEventListener('change', applyFilters);
document.getElementById('tableLoadMore').addEventListener('click', renderTable);
</script>
